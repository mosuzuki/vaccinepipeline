# Vaccine Development Pipeline Dashboard configuration
# Goal: candidate-level dashboard with stages from Discovery/Preclinical to Phase 4.
updated_by: GitHub Actions
refresh_schedule: weekly

clinicaltrials:
  base_url: https://clinicaltrials.gov/api/v2/studies
  page_size: 100
  max_pages_per_disease: 8
  # ClinicalTrials.gov returns trial-level records. The script groups these into approximate candidate-level records.
  query_template: 'AREA[ConditionSearch]({condition}) AND AREA[InterventionSearch](vaccine OR vaccination OR immunization OR immunisation OR monoclonal antibody)'
  diseases:
    - id: covid19
      label: COVID-19
      condition: COVID-19 OR SARS-CoV-2
      category: respiratory
    - id: coronavirus
      label: Coronavirus / MERS / SARS
      condition: Coronavirus Infections OR MERS-CoV OR SARS-CoV
      category: respiratory
    - id: influenza
      label: Influenza
      condition: Influenza
      category: respiratory
    - id: rsv
      label: RSV
      condition: Respiratory Syncytial Virus Infections
      category: respiratory
    - id: tuberculosis
      label: Tuberculosis
      condition: Tuberculosis
      category: bacterial
    - id: malaria
      label: Malaria
      condition: Malaria
      category: parasitic
    - id: hiv
      label: HIV
      condition: HIV Infections
      category: viral
    - id: dengue
      label: Dengue
      condition: Dengue
      category: arboviral
    - id: chikungunya
      label: Chikungunya
      condition: Chikungunya
      category: arboviral
    - id: zika
      label: Zika
      condition: Zika Virus Infection
      category: arboviral
    - id: mpox
      label: Mpox / Smallpox
      condition: Mpox OR Monkeypox OR Smallpox
      category: orthopoxvirus
    - id: ebola
      label: Ebola virus disease
      condition: Ebola Virus Disease
      category: viral_hemorrhagic_fever
    - id: marburg
      label: Marburg virus disease
      condition: Marburg Virus Disease
      category: viral_hemorrhagic_fever
    - id: lassa
      label: Lassa fever
      condition: Lassa Fever
      category: viral_hemorrhagic_fever
    - id: pneumococcal
      label: Pneumococcal disease
      condition: Pneumococcal Infections
      category: bacterial
    - id: meningococcal
      label: Meningococcal disease
      condition: Meningococcal Infections
      category: bacterial
    - id: shigella
      label: Shigella
      condition: Shigella Infections
      category: enteric
    - id: etec
      label: ETEC
      condition: Enterotoxigenic Escherichia coli
      category: enteric
    - id: norovirus
      label: Norovirus
      condition: Norovirus Infections
      category: enteric
    - id: gbs
      label: Group B Streptococcus
      condition: Streptococcus Agalactiae
      category: maternal_infant
    - id: hmpv
      label: Human metapneumovirus
      condition: Human Metapneumovirus
      category: respiratory
    - id: cmv
      label: Cytomegalovirus
      condition: Cytomegalovirus Infections
      category: congenital

# Best-effort automated public sources. Table/spreadsheet sources are parsed generically; CIDRAP is parsed with a custom best-effort HTML parser.
# They are crucial for preclinical candidates, which are generally absent from trial registries.
automated_curated_sources:
  - name: CIDRAP Coronavirus Vaccine Technology Landscape
    id_prefix: CIDRAP
    url: https://cvr.cidrap.umn.edu/coronavirus-vaccine-technology-landscape
    disease: Coronavirus / SARS-CoV-2 / MERS
    disease_id: coronavirus
    category: respiratory
    default_stage: Unknown
    enabled: true
    parser: cidrap_landscape
  - name: TB Vaccine Preclinical Pipeline
    id_prefix: TBPRE
    url: https://newtbvaccines.org/tb-vaccine-pipeline/preclinical-stage/
    disease: Tuberculosis
    disease_id: tuberculosis
    category: bacterial
    default_stage: Preclinical
    enabled: true
  - name: TB Vaccine Clinical Pipeline
    id_prefix: TBCLIN
    url: https://newtbvaccines.org/tb-vaccine-pipeline/clinical-phase/
    disease: Tuberculosis
    disease_id: tuberculosis
    category: bacterial
    default_stage: Unknown
    enabled: true
  - name: PATH RSV Clinical Trial Tracker
    id_prefix: PATHRSV
    url: https://media.path.org/documents/RSV_Clinical_Trial_Tracker_18SEPT2024.xlsx
    disease: RSV
    disease_id: rsv
    category: respiratory
    default_stage: Unknown
    as_of: 2024-09-18
    enabled: true

manual_reference_sources:
  - name: WHO Vaccine Pipeline Tracker
    url: https://www.who.int/teams/regulation-prequalification/eul/eul-vaccines/tracking-the-new-vaccine-pipeline
    status: manual_reference
  - name: WHO COVID-19 vaccine tracker and landscape
    url: https://www.who.int/teams/blueprint/covid-19/covid-19-vaccine-tracker-and-landscape
    status: manual_reference
  - name: CIDRAP Coronavirus Vaccine Technology Landscape
    url: https://cvr.cidrap.umn.edu/coronavirus-vaccine-technology-landscape
    status: manual_reference
  - name: PATH RSV and mAb Trial Tracker
    url: https://www.path.org/our-impact/resources/rsv-and-mab-trial-tracker/
    status: manual_reference
  - name: Vaccines Europe Pipeline Dashboard
    url: https://www.vaccineseurope.eu/vaccines-ecosystem/vaccines-pipeline/
    status: manual_reference
